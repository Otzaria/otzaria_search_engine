[package]
name = "otzaria-search-core"
version = "7.0.1"
edition = "2021"
description = "Headless Rust API for the canonical Otzaria search engine"
publish = false

[features]
default = ["sqlite-bundled"]
sqlite-bundled = ["search_engine/sqlite-bundled"]
sqlite-host = ["search_engine/sqlite-host"]
semantic = ["search_engine/semantic"]
semantic-integration = ["search_engine/semantic-integration"]
semantic-onnx = ["search_engine/semantic-onnx"]
semantic-mock = ["search_engine/semantic-mock"]

[dependencies]
# One implementation tree, owned by this repository. No vendored copy or second
# dependency/version list: the facade only selects the headless feature graph.
search_engine = { path = "..", default-features = false }

[dev-dependencies]
tempfile = "3.27.0"
serde_json = "1.0.150"
