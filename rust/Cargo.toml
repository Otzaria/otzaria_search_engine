[package]
name = "search_engine"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib", "staticlib", "rlib"]

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(frb_expand)'] }

[[bin]]
name = "benchmark_cli"
path = "src/bin/benchmark_cli.rs"

[dependencies]
env_logger = "0.11.10"
flutter_rust_bridge = "=2.12.0"
tempfile = "3.27.0"
tantivy= "=0.26.0"
jieba-rs = "0.8.1"
anyhow = "1.0.102"
once_cell = "1.21.4"
serde = { version = "1.0.228", features = ["derive"] }
serde_derive = "1.0"
serde_json = "1.0.149"
htmlescape = "0.3.1"
tokio = { version = "1.51.0", features = [ "test-util", "macros"] }
log = "0.4.29"
futures = "0.3.32"
async-stream = "0.3.5"
unicode-segmentation = "1.13.2"
