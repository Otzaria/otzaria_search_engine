[package]
name = "search_engine"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib", "staticlib", "rlib"]

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(frb_expand)'] }

[lints.clippy]
# The search APIs are exposed through flutter_rust_bridge, whose generated
# bindings mirror each function's signature, so wide parameter lists are
# inherent and cannot be bundled into a struct without breaking the bindings.
too_many_arguments = "allow"

[[bin]]
name = "benchmark_cli"
path = "src/bin/benchmark_cli.rs"

[dependencies]
env_logger = "0.11.10"
flutter_rust_bridge = "=2.12.0"
tempfile = "3.27.0"
tantivy= "=0.26.1"
tantivy-fst = "=0.5.0"
jieba-rs = "0.10.1"
anyhow = "1.0.102"
once_cell = "1.21.4"
serde = { version = "1.0.228", features = ["derive"] }
serde_derive = "1.0"
serde_json = "1.0.150"
htmlescape = "0.3.1"
tokio = { version = "1.52.3", features = [ "test-util", "macros"] }
log = "0.4.30"
futures = "0.3.32"
async-stream = "0.3.6"
unicode-segmentation = "1.13.2"
