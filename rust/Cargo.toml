[package]
name = "search_engine"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib", "staticlib", "rlib"]

[features]
default = []
semantic = ["dep:otzaria-semantic-search"]

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(frb_expand)'] }

[lints.clippy]
too_many_arguments = "allow"

[[bin]]
name = "benchmark_cli"
path = "src/bin/benchmark_cli.rs"

[dependencies]
env_logger = "0.11.10"
flutter_rust_bridge = "=2.12.0"
tempfile = "3.27.0"
tantivy= "=0.26.1"
tantivy-fst = "=0.5.0"
levenshtein_automata = "0.2.1"
jieba-rs = "0.10.1"
anyhow = "1.0.102"
once_cell = "1.21.4"
serde = { version = "1.0.228", features = ["derive"] }
serde_derive = "1.0"
serde_json = "1.0.150"
htmlescape = "0.3.1"
tokio = { version = "1.52.3", features = [ "test-util", "macros", "rt-multi-thread"] }
tokio-util = "0.7"
async-trait = "0.1"
thiserror = "2.0"
tracing = "0.1"
dashmap = "6.1"
smallvec = "1.13"
log = "0.4.32"
futures = "0.3.32"
async-stream = "0.3.6"
unicode-segmentation = "1.13.3"
rusqlite = { version = "0.32", features = ["bundled"] }
lru = "0.12"
rayon = "1.10"

# Optional dependency: fetched from git repository during compilation
otzaria-semantic-search = { git = "https://github.com/Otzaria/otzaria-semantic-search", optional = true }

[patch.crates-io]
tantivy-fst = { path = "vendor/tantivy-fst" }
