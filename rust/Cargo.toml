[package]
name = "search_engine"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib", "staticlib", "rlib"]

[[bin]]
name = "benchmark_cli"
path = "src/bin/benchmark_cli.rs"

[dependencies]
env_logger = "0.11.8"
flutter_rust_bridge = "=2.11.1"
tempfile = "3.23.0"
tantivy= "=0.25.0"
jieba-rs = "0.8.1"
anyhow = "1.0.100"
once_cell = "1.5"
serde = { version = "1.0.228", features = ["derive"] }
serde_derive = "1.0"
serde_json = "1.0.145"
htmlescape = "0.3.1"
tokio = { version = "0.2", features = ["rt-threaded", "test-util", "macros"] }
log = "0.4.28"
futures = "0.3"
async-stream = "0.3.5"
