name: Native Assets

# The build hook is the only way the library reaches an app, so every platform
# is exercised end to end: a fresh app bundles the code asset and searches
# through it on a desktop, a simulator and an emulator.
on:
  push:
    branches: [refactor]
  pull_request:
  workflow_dispatch:
  # Runs the Apple job even when no change asked for it, to catch drift.
  schedule:
    - cron: "30 2 * * 1"

permissions:
  contents: read

concurrency:
  # The event keeps a scheduled run from cancelling a push run on the same ref.
  group: native-assets-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # macOS runners are few and shared across the org, so the Apple job runs only
  # when a change can affect it.
  changes:
    name: Detect Apple-relevant changes
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      apple: ${{ steps.detect.outputs.apple }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          filter: blob:none

      - id: detect
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
          BEFORE: ${{ github.event.before }}
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          set -uo pipefail
          # Functions return 1 on any error; the caller then answers true.
          relevant() {
            local files
            files=$(git diff --name-only "$@") || return 1
            if grep -qE '^(rust/|hook/|lib/src/hook/|lib/src/rust/frb_generated[^/]*\.dart$|\.github/workflows/native-assets\.yml$)' <<<"$files"; then
              echo true
              return 0
            fi
            if grep -qx pubspec.yaml <<<"$files"; then
              local diff
              diff=$(git diff -U0 "$@" -- pubspec.yaml) || return 1
              # A bare version bump changes nothing the hook builds.
              if awk '/^@@/ { hunk = 1; next } hunk && /^[-+]/ && !/^[-+]version:/ { found = 1 } END { exit !found }' <<<"$diff"; then
                echo true
                return 0
              fi
            fi
            echo false
          }
          decide() {
            case "$EVENT" in
              pull_request)
                [ -n "$BASE" ] && [ -n "$HEAD" ] || return 1
                relevant "$BASE...$HEAD"
                ;;
              push)
                if [ -z "${BEFORE//0/}" ]; then
                  echo true
                  return 0
                fi
                # A merged PR's commit: the PR already ran the Apple job if it needed to.
                local merged
                merged=$(gh api "repos/$REPO/commits/$SHA/pulls" \
                  --jq '.[] | select(.merged_at != null) | .merge_commit_sha') || return 1
                if grep -qxF "$SHA" <<<"$merged"; then
                  echo false
                  return 0
                fi
                relevant "$BEFORE" "$SHA"
                ;;
              *) echo true ;;
            esac
          }
          if ! apple=$(decide) || [ -z "$apple" ]; then
            echo "::warning::Could not tell which files changed; running the Apple job"
            apple=true
          fi
          echo "Apple job: $apple"
          echo "apple=$apple" >> "$GITHUB_OUTPUT"

  app:
    name: App on ${{ matrix.platform }}
    runs-on: ${{ matrix.os }}
    # No precompiled binary exists for a branch, so the hook compiles the crate.
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux
            os: ubuntu-24.04
          - platform: windows
            os: windows-2022
          - platform: android
            os: ubuntu-24.04
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v5
        with:
          path: otzaria_search_engine

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          # The app's Flutter, whose hooks runner ships the library.
          flutter-version: 3.47.2

      - uses: dtolnay/rust-toolchain@stable

      - if: matrix.platform == 'android'
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Linux desktop dependencies
        if: matrix.platform == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            clang cmake ninja-build pkg-config libgtk-3-dev xvfb

      - name: Create an app that depends on the package
        # Same script as in the apple job below; keep the two in sync.
        env:
          PLATFORMS: ${{ matrix.platform }}
        run: |
          set -euo pipefail
          flutter create --platforms="$PLATFORMS" --org org.otzaria probe
          cd probe
          flutter pub add "otzaria_search_engine:{path: ../otzaria_search_engine}" path_provider
          flutter pub add "dev:integration_test:{sdk: flutter}"
          mkdir -p integration_test
          cat > integration_test/search_test.dart <<'EOF'
          import 'package:flutter_test/flutter_test.dart';
          import 'package:integration_test/integration_test.dart';
          import 'package:otzaria_search_engine/otzaria_search_engine.dart';
          import 'package:path_provider/path_provider.dart';

          void main() {
            IntegrationTestWidgetsFlutterBinding.ensureInitialized();

            testWidgets('the bundled engine indexes and searches', (_) async {
              await RustLib.init();
              final temp = await getTemporaryDirectory();
              temp.createSync(recursive: true);
              final dir = temp.createTempSync('probe_index_');
              final engine = await SearchEngine.newInstance(path: dir.path);
              await engine.addDocument(
                ordinal: 0,
                title: 'Document 1',
                reference: 'Reference 1',
                topics: '/probe',
                text: 'יהודים',
                segment: BigInt.two,
                isPdf: false,
                filePath: '/probe/doc1',
              );
              await engine.commit();
              final results = await engine.search(
                regexTerms: ['יהודים'],
                facets: ['/'],
                limit: 1,
                offset: 0,
                slop: 0,
                maxExpansions: 50,
                order: ResultsOrder.relevance,
              );
              expect(results, hasLength(1));
              expect(results.single.title, 'Document 1');
              // A new index's first book, at ordinal 0 (line number 1).
              expect(results.single.id, (BigInt.one << 32) | BigInt.one);
              expect(results.single.reference, 'Reference 1');
              expect(results.single.segment, BigInt.two);
            });
          }
          EOF

      - name: Run on the Linux desktop
        if: matrix.platform == 'linux'
        working-directory: probe
        run: xvfb-run -a flutter test integration_test -d linux

      - name: Run on the Windows desktop
        if: matrix.platform == 'windows'
        working-directory: probe
        run: flutter test integration_test -d windows

      - name: Install the Android emulator with download retries
        if: matrix.platform == 'android'
        timeout-minutes: 10
        run: |
          set -euo pipefail
          # The Ubuntu runner needs PulseAudio even for emulator -version.
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libpulse0
          sdk_root="${ANDROID_HOME:?ANDROID_HOME must point to the Android SDK}"
          sdkmanager="$sdk_root/cmdline-tools/latest/bin/sdkmanager"
          (yes || true) | "$sdkmanager" --licenses > /dev/null
          # The runner installs emulator unconditionally. Install it first so a
          # truncated SDK archive can be discarded and downloaded again, without
          # retrying app builds or tests.
          for attempt in 1 2 3; do
            if "$sdkmanager" --install emulator --channel=0 && "$sdk_root/emulator/emulator" -version; then
              break
            fi
            if [ "$attempt" -eq 3 ]; then
              echo '::error::Android emulator installation failed after three attempts'
              exit 1
            fi
            echo "::warning::Emulator installation attempt $attempt failed; clearing download caches before retry"
            rm -rf "$sdk_root/.temp" "${ANDROID_USER_HOME:-$HOME/.android}/cache"
            sleep "$((attempt * 10))"
          done

      - name: Prepare the Android emulator
        if: matrix.platform == 'android'
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          # Only the emulator ABI, or the hook compiles all three from source.
          echo 'target-platform=android-x64' >> probe/android/gradle.properties

      # API 24 is the app's minSdk: a library linked against newer libc symbols
      # fails to load here.
      - name: Run on an Android emulator
        if: matrix.platform == 'android'
        timeout-minutes: 45
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 24
          arch: x86_64
          target: default
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-snapshot
          working-directory: probe
          # The runner reports boot before the package manager answers; an install then hangs.
          # Each line runs on its own, hence the one-line loop and the retry.
          script: |
            until adb shell pm path android | grep -q package:; do sleep 2; done
            timeout 900 flutter test integration_test -d emulator-5554 || timeout 900 flutter test integration_test -d emulator-5554

  apple:
    name: App on Apple (macOS + iOS)
    needs: changes
    # Runs as well when the changes job itself failed: an empty answer is not "false".
    if: ${{ !cancelled() && needs.changes.outputs.apple != 'false' }}
    # One runner for both platforms: they share the crate's dependency builds.
    runs-on: macos-15
    timeout-minutes: 100
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v5
        with:
          path: otzaria_search_engine

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          # The app's Flutter, whose hooks runner ships the library.
          flutter-version: 3.47.2

      - uses: dtolnay/rust-toolchain@stable

      - name: Create an app that depends on the package
        id: probe
        env:
          PLATFORMS: macos,ios
        run: |
          set -euo pipefail
          flutter create --platforms="$PLATFORMS" --org org.otzaria probe
          cd probe
          flutter pub add "otzaria_search_engine:{path: ../otzaria_search_engine}" path_provider
          flutter pub add "dev:integration_test:{sdk: flutter}"
          mkdir -p integration_test
          cat > integration_test/search_test.dart <<'EOF'
          import 'package:flutter_test/flutter_test.dart';
          import 'package:integration_test/integration_test.dart';
          import 'package:otzaria_search_engine/otzaria_search_engine.dart';
          import 'package:path_provider/path_provider.dart';

          void main() {
            IntegrationTestWidgetsFlutterBinding.ensureInitialized();

            testWidgets('the bundled engine indexes and searches', (_) async {
              await RustLib.init();
              final temp = await getTemporaryDirectory();
              temp.createSync(recursive: true);
              final dir = temp.createTempSync('probe_index_');
              final engine = await SearchEngine.newInstance(path: dir.path);
              await engine.addDocument(
                ordinal: 0,
                title: 'Document 1',
                reference: 'Reference 1',
                topics: '/probe',
                text: 'יהודים',
                segment: BigInt.two,
                isPdf: false,
                filePath: '/probe/doc1',
              );
              await engine.commit();
              final results = await engine.search(
                regexTerms: ['יהודים'],
                facets: ['/'],
                limit: 1,
                offset: 0,
                slop: 0,
                maxExpansions: 50,
                order: ResultsOrder.relevance,
              );
              expect(results, hasLength(1));
              expect(results.single.title, 'Document 1');
              // A new index's first book, at ordinal 0 (line number 1).
              expect(results.single.id, (BigInt.one << 32) | BigInt.one);
              expect(results.single.reference, 'Reference 1');
              expect(results.single.segment, BigInt.two);
            });
          }
          EOF

      # hooks_runner keeps the hook's shared output under the app's .dart_tool, the
      # same directory for the macOS and iOS builds; the hook builds into its target.
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: otzaria_search_engine/rust -> ../../probe/.dart_tool/hooks_runner/shared/otzaria_search_engine/build/target
          # Saved from the default branch only, as in rust-quality.yml.
          save-if: ${{ github.ref == 'refs/heads/refactor' }}
          key: apple-app

      - name: Run on the macOS desktop
        working-directory: probe
        timeout-minutes: 40
        run: flutter test integration_test -d macos

      - name: Run on an iOS simulator
        # Also after a macOS failure, so both results show.
        if: ${{ !cancelled() && steps.probe.outcome == 'success' }}
        working-directory: probe
        timeout-minutes: 50
        run: |
          set -euo pipefail
          # An iPhone on the newest runtime: an old, never-booted one boots for minutes.
          udid=$(xcrun simctl list devices available -j \
            | python3 -c 'import json,sys; d=json.load(sys.stdin)["devices"]; v=lambda r: [int(n) for n in r.rsplit(".",1)[-1].split("-")[1:]]; phones={r: [x for x in l if x["name"].startswith("iPhone")] for r,l in d.items() if ".iOS-" in r}; r=max((r for r in phones if phones[r]), key=v); print(phones[r][0]["udid"])')
          xcrun simctl boot "$udid"
          # Launching before the boot completes leaves flutter waiting for the VM service.
          xcrun simctl bootstatus "$udid" -b
          # Compiles the crate once, so an attempt below costs only the launch. `-d` keeps
          # it to this simulator's arch; without it x86_64 is compiled too.
          flutter -d "$udid" build ios --simulator --debug -t integration_test/search_test.dart
          # flutter at times never finds a simulator app's VM service: retry instead of waiting.
          for attempt in 1 2 3; do
            if perl -e 'alarm shift; exec @ARGV' 300 flutter test integration_test -d "$udid"; then
              exit 0
            fi
            echo "::warning::Attempt $attempt did not pass"
            xcrun simctl spawn "$udid" log show --last 15m --style compact \
              --predicate 'process == "Runner"' | tail -n 60 || true
            # shellcheck disable=SC2012 # Only names, newest first.
            ls -t ~/Library/Logs/DiagnosticReports 2>/dev/null | head -n 5 || true
          done
          exit 1
