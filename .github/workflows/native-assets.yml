name: Native Assets

# The build hook is the only way the library reaches an app, so every platform
# is exercised end to end: a fresh app bundles the code asset and searches
# through it on a desktop, a simulator and an emulator.
on:
  push:
    branches: [refactor]
  pull_request:
  workflow_dispatch:

concurrency:
  group: native-assets-${{ github.ref }}
  cancel-in-progress: true

jobs:
  app:
    name: App on ${{ matrix.platform }}
    runs-on: ${{ matrix.os }}
    # No precompiled binary exists for a branch, so the hook compiles the crate.
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux
            os: ubuntu-24.04
          - platform: windows
            os: windows-2022
          - platform: macos
            os: macos-15
          - platform: ios
            os: macos-15
          - platform: android
            os: ubuntu-24.04
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v5
        with:
          path: otzaria_search_engine

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          # The app's Flutter, whose hooks runner ships the library.
          flutter-version: 3.47.2

      - uses: dtolnay/rust-toolchain@stable

      - if: matrix.platform == 'android'
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Linux desktop dependencies
        if: matrix.platform == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            clang cmake ninja-build pkg-config libgtk-3-dev xvfb

      - name: Create an app that depends on the package
        run: |
          set -euo pipefail
          flutter create --platforms=${{ matrix.platform }} --org org.otzaria probe
          cd probe
          flutter pub add "otzaria_search_engine:{path: ../otzaria_search_engine}" path_provider
          flutter pub add "dev:integration_test:{sdk: flutter}"
          mkdir -p integration_test
          cat > integration_test/search_test.dart <<'EOF'
          import 'dart:io';

          import 'package:flutter_test/flutter_test.dart';
          import 'package:integration_test/integration_test.dart';
          import 'package:otzaria_search_engine/otzaria_search_engine.dart';
          import 'package:path_provider/path_provider.dart';

          void main() {
            IntegrationTestWidgetsFlutterBinding.ensureInitialized();

            testWidgets('the bundled engine indexes and searches', (_) async {
              await RustLib.init();
              final temp = await getTemporaryDirectory();
              final dir = Directory('${temp.path}/probe_index')..createSync(recursive: true);
              final engine = await SearchEngine.newInstance(path: dir.path);
              await engine.addDocument(
                id: BigInt.one,
                title: 'Document 1',
                reference: 'Reference 1',
                topics: '/probe',
                text: 'יהודים',
                segment: BigInt.two,
                isPdf: false,
                filePath: '/probe/doc1',
              );
              await engine.commit();
              final results = await engine.search(
                regexTerms: ['יהודים'],
                facets: ['/'],
                limit: 1,
                offset: 0,
                slop: 0,
                maxExpansions: 50,
                order: ResultsOrder.relevance,
              );
              expect(results, hasLength(1));
              expect(results.single.title, 'Document 1');
            });
          }
          EOF

      - name: Rust version
        id: rustc
        run: echo "version=$(rustc -V | cut -d' ' -f2)" >> "$GITHUB_OUTPUT"

      # The hook builds into the hooks runner's shared directory, under the app.
      - name: Restore Rust build cache
        id: rust-cache
        uses: actions/cache/restore@v4
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            probe/.dart_tool/hooks_runner/shared/otzaria_search_engine/build/target
          key: native-assets-${{ matrix.platform }}-${{ runner.arch }}-rust${{ steps.rustc.outputs.version }}-${{ hashFiles('otzaria_search_engine/rust/Cargo.lock') }}-${{ hashFiles('otzaria_search_engine/rust/**') }}
          restore-keys: |
            native-assets-${{ matrix.platform }}-${{ runner.arch }}-rust${{ steps.rustc.outputs.version }}-${{ hashFiles('otzaria_search_engine/rust/Cargo.lock') }}-

      # An exact hit means identical sources; old mtimes keep the fresh checkout
      # from making cargo rebuild the path crates.
      - name: Mark cached crate sources as unchanged
        if: steps.rust-cache.outputs.cache-hit == 'true'
        run: find otzaria_search_engine/rust -type f -exec touch -t 200001010000 {} +

      - name: Run on the Linux desktop
        if: matrix.platform == 'linux'
        working-directory: probe
        run: xvfb-run -a flutter test integration_test -d linux

      - name: Run on the Windows desktop
        if: matrix.platform == 'windows'
        working-directory: probe
        run: flutter test integration_test -d windows

      - name: Run on the macOS desktop
        if: matrix.platform == 'macos'
        working-directory: probe
        run: flutter test integration_test -d macos

      - name: Run on an iOS simulator
        if: matrix.platform == 'ios'
        working-directory: probe
        timeout-minutes: 75
        run: |
          set -euo pipefail
          # An iPhone on the newest runtime: an old, never-booted one boots for minutes.
          udid=$(xcrun simctl list devices available -j \
            | python3 -c 'import json,sys; d=json.load(sys.stdin)["devices"]; v=lambda r: [int(n) for n in r.rsplit(".",1)[-1].split("-")[1:]]; phones={r: [x for x in l if x["name"].startswith("iPhone")] for r,l in d.items() if ".iOS-" in r}; r=max((r for r in phones if phones[r]), key=v); print(phones[r][0]["udid"])')
          xcrun simctl boot "$udid"
          # Launching before the boot completes leaves flutter waiting for the VM service.
          xcrun simctl bootstatus "$udid" -b
          # Compiles the crate once, so a timed-out attempt below costs only the launch.
          flutter build ios --simulator --debug -t integration_test/search_test.dart
          # flutter at times never finds a simulator app's VM service: retry instead of waiting.
          for attempt in 1 2 3; do
            if perl -e 'alarm shift; exec @ARGV' 900 flutter test integration_test -d "$udid"; then
              exit 0
            fi
            echo "::warning::Attempt $attempt did not pass"
            xcrun simctl spawn "$udid" log show --last 15m --style compact \
              --predicate 'process == "Runner"' | tail -n 60 || true
            ls -t ~/Library/Logs/DiagnosticReports 2>/dev/null | head -n 5 || true
          done
          exit 1

      - name: Prepare the Android emulator
        if: matrix.platform == 'android'
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          # Only the emulator ABI, or the hook compiles all three from source.
          echo 'target-platform=android-x64' >> probe/android/gradle.properties

      # API 24 is the app's minSdk: a library linked against newer libc symbols
      # fails to load here.
      - name: Run on an Android emulator
        if: matrix.platform == 'android'
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 24
          arch: x86_64
          target: default
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-snapshot
          working-directory: probe
          script: flutter test integration_test -d emulator-5554

      # Saved from refactor only: the repository's cache quota is already full.
      - name: Save Rust build cache
        if: github.ref == 'refs/heads/refactor' && steps.rust-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            probe/.dart_tool/hooks_runner/shared/otzaria_search_engine/build/target
          key: ${{ steps.rust-cache.outputs.cache-primary-key }}
