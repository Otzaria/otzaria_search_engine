name: Publish to pub.dev

# מופעל מדחיפת תג גרסה (release-tag.yml יוצר אותו מקומיט שהודעתו מספר בלבד),
# בונה ומאמת קודם את כל הבינאריים מאותו קומיט,
# ומפרסם דרך Automated publishing של pub.dev: האימות נעשה באסימון OIDC של
# ההרצה, ולכן אין כאן שום סוד של חשבון pub.dev.
on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+*"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: publish-pub-dev-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    name: Validate release tag
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}

      - name: Verify the tag matches pubspec version
        env:
          TAG: ${{ github.ref_name }}
          REF_TYPE: ${{ github.ref_type }}
        run: |
          set -euo pipefail
          pubspec_version="$(sed -n 's/^version:[[:space:]]*//p' pubspec.yaml | head -n 1 | tr -d '\r')"
          if [ "$REF_TYPE" != "tag" ] || [ "$TAG" != "v$pubspec_version" ]; then
            echo "::error::הפרסום חייב לרוץ על תג v$pubspec_version שתואם ל-pubspec.yaml (התקבל $REF_TYPE $TAG)."
            exit 1
          fi
          echo "מפרסם $pubspec_version לאחר אימות הבינאריים." >> "$GITHUB_STEP_SUMMARY"

  binaries:
    name: Build and verify all precompiled binaries
    needs: validate
    permissions:
      contents: write
    uses: ./.github/workflows/precompiled-binaries.yml
    secrets:
      PRIVATE_KEY: ${{ secrets.PRIVATE_KEY }}

  publish:
    name: flutter pub publish
    needs: binaries
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      # Only publishing may request a pub.dev OIDC token.
      id-token: write
    # רשת ביטחון: כשל אימות אינו נכשל אלא נתלה — pub מרים שרת מקומי וממתין
    # ל-redirect שלא יגיע לעולם, והג'וב היה מחזיק runner עד תום 6 שעות.
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}

      - uses: subosito/flutter-action@v2
        with:
          channel: stable

      # ל-pub publish דרושה resolution של התלויות, ולחבילת Flutter היא נכשלת
      # תחת dart טהור — ולכן flutter, כמו בשאר ה-workflows כאן.
      - name: flutter pub get
        run: flutter pub get

      # Keep the existing --force warning policy: FRB is intentionally pinned
      # to match Rust/generated code, so pub warns about its exact constraint.
      - name: Validate the pub.dev package
        run: flutter pub publish --dry-run --ignore-warnings

      # ה-pub המצורף ל-Flutter אינו מבצע בעצמו את חילוף ה-OIDC מול pub.dev:
      # הוא מתעלם מהאסימון שגיטהאב הנפיק (אימתנו שהוא זמין בשלב) ונופל למסלול
      # ההתחברות האינטראקטיבי, שממתין ל-redirect ל-localhost עד שההרצה נהרגת.
      # לכן מביאים את האסימון בעצמנו ורושמים אותו כאסימון של pub.dev.
      - name: Authenticate to pub.dev with the run's OIDC token
        run: |
          set -euo pipefail

          if [ -z "${ACTIONS_ID_TOKEN_REQUEST_URL:-}" ]; then
            echo "::error::אין אסימון OIDC להרצה — ודאו ש-permissions כולל id-token: write."
            exit 1
          fi

          token="$(curl -sS \
            -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=https://pub.dev" \
            | jq -r '.value')"

          if [ -z "$token" ] || [ "$token" = "null" ]; then
            echo "::error::בקשת אסימון ה-OIDC נכשלה."
            exit 1
          fi

          # מיסוך לפני כל שימוש, כדי שהאסימון לא ידלוף ללוג.
          echo "::add-mask::$token"
          echo "PUB_TOKEN=$token" >> "$GITHUB_ENV"

          dart pub token add https://pub.dev --env-var PUB_TOKEN

      - name: flutter pub publish --force
        run: flutter pub publish --force
