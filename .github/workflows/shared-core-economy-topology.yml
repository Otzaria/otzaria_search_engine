name: Shared core economy topology diagnostic

on:
  push:
    branches: [diag/shared-core-economy-topology-20261107]

permissions:
  contents: read
  actions: read

jobs:
  topology-controls:
    name: Preserved binaries on sibling and distinct cores
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
        with:
          path: controller
          persist-credentials: false
      - name: Download the immutable source artifact ZIP
        env:
          ARTIFACT_READ_TOKEN: ${{ github.token }}
          ORIGINAL_ARCHIVE: ${{ runner.temp }}/original-economy.zip
        run: |
          python3 - <<'PY'
          import os
          import shutil
          from urllib.error import HTTPError, URLError
          from urllib.parse import urlsplit
          from urllib.request import HTTPRedirectHandler, Request, build_opener

          class NoRedirect(HTTPRedirectHandler):
              def redirect_request(self, request, response, code, message, headers, new_url):
                  return None

          opener = build_opener(NoRedirect())
          request = Request(
              "https://api.github.com/repos/Otzaria/otzaria_search_engine/actions/artifacts/13594355530/zip",
              headers={"Accept": "application/vnd.github+json",
                       "Authorization": "Bearer " + os.environ["ARTIFACT_READ_TOKEN"],
                       "X-GitHub-Api-Version": "2022-11-28", "User-Agent": "otzaria-topology-diagnostic"},
          )
          try:
              with opener.open(request, timeout=60):
                  raise RuntimeError("GitHub artifact endpoint did not return its expected redirect")
          except HTTPError as error:
              code, location = error.code, error.headers.get("Location")
              error.close()
              if code != 302 or not location:
                  raise RuntimeError(f"GitHub artifact request failed with HTTP {code}") from None
          except URLError:
              raise RuntimeError("GitHub artifact request failed") from None
          parsed = urlsplit(location)
          if (parsed.scheme != "https" or not parsed.hostname
                  or parsed.username is not None or parsed.password is not None or parsed.port not in (None, 443)):
              raise RuntimeError("Artifact storage redirect must use HTTPS without user credentials")
          # This separate request carries no GitHub Authorization header and cannot redirect again.
          storage_request = Request(location, headers={"User-Agent": "otzaria-topology-diagnostic"})
          try:
              with opener.open(storage_request, timeout=60) as source, open(os.environ["ORIGINAL_ARCHIVE"], "wb") as target:
                  shutil.copyfileobj(source, target)
          except (HTTPError, URLError):
              raise RuntimeError("Artifact storage download failed; no redirected credentials were sent") from None
          PY
      - name: Verify the artifact, then compare two logical-CPU topologies
        run: >
          python3 controller/tool/shared_core_economy_topology.py
          --archive "${{ runner.temp }}/original-economy.zip"
          --out "${{ runner.temp }}/economy-topology"
      - name: Preserve binaries, provenance and partial results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: economy-topology-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/economy-topology/
          if-no-files-found: error
          compression-level: 1
          retention-days: 14
