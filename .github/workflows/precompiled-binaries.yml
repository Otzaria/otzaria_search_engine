name: Precompiled Binaries

# Release publishing calls this workflow before uploading to pub.dev. Regular
# code pushes do not spend runners on every platform; manual builds stay available.
on:
  workflow_call:
    secrets:
      PRIVATE_KEY:
        required: true
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: precompiled-binaries-${{ github.sha }}
  cancel-in-progress: false

jobs:
  prepare-release:
    name: Prepare release
    runs-on: ubuntu-24.04
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}

      - uses: dart-lang/setup-dart@v1

      - name: Install build tool dependencies
        working-directory: cargokit/build_tool
        run: dart pub get

      - name: Ensure precompiled-binaries release exists
        working-directory: cargokit/build_tool
        run: |
          dart run bin/build_tool.dart prepare-release \
            --repository "${{ github.repository }}" \
            --manifest-dir ../../rust

  # One target group per runner: a macOS runner has few cores, and building
  # every target in sequence on one made it the long pole of the release.
  publish-apple:
    name: Publish Apple (${{ matrix.name }})
    needs: prepare-release
    runs-on: macos-15
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS
            targets: x86_64-apple-darwin aarch64-apple-darwin
          - name: iOS
            targets: aarch64-apple-ios
          - name: iOS simulator
            targets: aarch64-apple-ios-sim x86_64-apple-ios
    env:
      # Unset, cc-rs compiles the C deps at the runner SDK's default while
      # rustc uses its own much lower one, so both minimums land in the same
      # .a - warning on every consumer, and on iOS failing the link outright
      # (rustc's default has no __chkstk_darwin in libSystem).
      IPHONEOS_DEPLOYMENT_TARGET: "15.0"
      MACOSX_DEPLOYMENT_TARGET: "12.0"
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}

      - uses: dart-lang/setup-dart@v1

      - uses: dtolnay/rust-toolchain@stable

      - name: Install build tool dependencies
        working-directory: cargokit/build_tool
        run: dart pub get

      - name: Publish Apple artifacts
        working-directory: cargokit/build_tool
        shell: bash
        env:
          PRIVATE_KEY: ${{ secrets.PRIVATE_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TARGETS: ${{ matrix.targets }}
        run: |
          set -euo pipefail
          target_args=()
          for target in $TARGETS; do
            target_args+=(--target "$target")
          done
          dart run bin/build_tool.dart precompile-binaries \
            --repository "${{ github.repository }}" \
            --manifest-dir ../../rust \
            "${target_args[@]}"

  # The NDK cross-compiles from Linux, on a cheaper and faster runner than
  # macOS, one ABI per runner. The hosted image ships the SDK and an NDK, and
  # precompiling never installs one, so no Java is needed.
  publish-android:
    name: Publish Android (${{ matrix.target }})
    needs: prepare-release
    # The NDK's Linux toolchain is linux-x86_64 only.
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        target:
          - armv7-linux-androideabi
          - aarch64-linux-android
          - i686-linux-android
          - x86_64-linux-android
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}

      - uses: dart-lang/setup-dart@v1

      - uses: dtolnay/rust-toolchain@stable

      - name: Install build tool dependencies
        working-directory: cargokit/build_tool
        run: dart pub get

      - name: Publish Android artifacts
        working-directory: cargokit/build_tool
        shell: bash
        # Secrets are scoped to this step only so earlier steps (and any
        # third-party actions) never see them in their environment.
        env:
          PRIVATE_KEY: ${{ secrets.PRIVATE_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          if [[ -z "${PRIVATE_KEY:-}" ]]; then
            echo "Missing PRIVATE_KEY secret"
            exit 1
          fi

          ANDROID_SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-}}"
          if [[ -z "${ANDROID_SDK_ROOT}" ]]; then
            echo "ANDROID_SDK_ROOT/ANDROID_HOME is not set"
            exit 1
          fi
          if [[ ! -d "${ANDROID_SDK_ROOT}/ndk" ]]; then
            echo "No Android NDK installations found under ${ANDROID_SDK_ROOT}/ndk"
            exit 1
          fi

          ANDROID_NDK_VERSION="$(find "${ANDROID_SDK_ROOT}/ndk" -mindepth 1 -maxdepth 1 -type d -exec basename {} \; | sort -V | tail -n1)"
          if [[ -z "${ANDROID_NDK_VERSION}" ]]; then
            echo "Unable to determine Android NDK version"
            exit 1
          fi

          dart run bin/build_tool.dart precompile-binaries \
            --repository "${{ github.repository }}" \
            --manifest-dir ../../rust \
            --android-sdk-location "${ANDROID_SDK_ROOT}" \
            --android-ndk-version "${ANDROID_NDK_VERSION}" \
            --android-min-sdk-version 21 \
            --target "${{ matrix.target }}"

  publish-linux:
    name: Publish Linux (${{ matrix.target }})
    needs: prepare-release
    runs-on: ${{ matrix.runs_on }}
    container:
      image: debian:bookworm
    strategy:
      fail-fast: false
      matrix:
        include:
          - runs_on: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
          - runs_on: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
    steps:
      - name: Install container build dependencies
        shell: bash
        run: |
          set -euo pipefail
          apt-get update
          apt-get install -y --no-install-recommends \
            binutils build-essential ca-certificates curl git pkg-config unzip \
            xz-utils
          git config --global --add safe.directory '*'

      - uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}

      - uses: dart-lang/setup-dart@v1

      - uses: dtolnay/rust-toolchain@stable

      - name: Install build tool dependencies
        working-directory: cargokit/build_tool
        run: dart pub get

      - name: Publish Linux artifacts
        working-directory: cargokit/build_tool
        env:
          PRIVATE_KEY: ${{ secrets.PRIVATE_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          dart run bin/build_tool.dart precompile-binaries \
            --repository "${{ github.repository }}" \
            --manifest-dir ../../rust \
            --target "${{ matrix.target }}"

  publish-windows:
    name: Publish Windows (${{ matrix.target }})
    needs: prepare-release
    runs-on: ${{ matrix.runs_on }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runs_on: windows-2022
            target: x86_64-pc-windows-msvc
          - runs_on: windows-11-arm
            target: aarch64-pc-windows-msvc
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}

      - uses: dart-lang/setup-dart@v1

      - uses: dtolnay/rust-toolchain@stable

      # The C dependencies (the bundled SQLite, zstd) are compiled by cc-rs
      # with the hosted ARM image's clang-cl rather than its MSVC default, the
      # compiler the published Windows ARM binaries have always been built
      # with. Nothing in the build is C++ or goes through CMake any more, so
      # the C compiler is all there is to choose.
      - name: Configure clang-cl for Windows ARM
        if: matrix.target == 'aarch64-pc-windows-msvc'
        shell: pwsh
        run: |
          clang-cl --version
          "CC=clang-cl" >> $env:GITHUB_ENV

      - name: Install build tool dependencies
        working-directory: cargokit/build_tool
        run: dart pub get

      - name: Publish Windows artifacts
        working-directory: cargokit/build_tool
        shell: pwsh
        env:
          PRIVATE_KEY: ${{ secrets.PRIVATE_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: >
          dart run bin/build_tool.dart precompile-binaries
          --repository "${{ github.repository }}"
          --manifest-dir "../../rust"
          --target ${{ matrix.target }}

  verify:
    name: Verify published binaries
    permissions:
      contents: read
    runs-on: ubuntu-24.04
    needs:
      - publish-apple
      - publish-android
      - publish-linux
      - publish-windows
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}

      - uses: dart-lang/setup-dart@v1

      - name: Install build tool dependencies
        working-directory: cargokit/build_tool
        run: dart pub get

      - name: Verify all signed artifacts are downloadable
        working-directory: cargokit/build_tool
        run: dart run bin/build_tool.dart verify-binaries --manifest-dir ../../rust
