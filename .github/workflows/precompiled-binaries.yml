name: Precompiled Binaries

# Publishes the signed libraries the build hook downloads, one release per
# crate hash. Release publishing calls this before uploading to pub.dev;
# regular pushes do not spend runners on every platform.
on:
  workflow_call:
    secrets:
      PRIVATE_KEY:
        required: true
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: precompiled-binaries-${{ github.sha }}
  cancel-in-progress: false

defaults:
  run:
    shell: bash
    working-directory: tool/precompiled_binaries

jobs:
  prepare-release:
    name: Prepare release
    runs-on: ubuntu-24.04
    outputs:
      tag: ${{ steps.release.outputs.tag }}
      complete: ${{ steps.release.outputs.complete }}
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v5

      - uses: dart-lang/setup-dart@v1

      - run: dart pub get

      - run: dart analyze --fatal-infos

      - name: Ensure the release of this crate hash exists
        id: release
        run: |
          set -euo pipefail
          tag="precompiled_$(dart run bin/precompiled_binaries.dart hash)"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          if dart run bin/precompiled_binaries.dart verify; then
            echo "complete=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "complete=false" >> "$GITHUB_OUTPUT"
          if ! gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release create "$tag" --repo "$GITHUB_REPOSITORY" \
              --target "$GITHUB_SHA" --title "$tag" --prerelease \
              --notes "Precompiled binaries for crate hash ${tag#precompiled_}."
          fi

  publish:
    name: Publish ${{ matrix.name }}
    needs: prepare-release
    if: needs.prepare-release.outputs.complete != 'true'
    runs-on: ${{ matrix.runs_on }}
    container: ${{ matrix.container }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # One target per runner keeps release builds parallel, as in #54.
          - name: macOS arm64
            runs_on: macos-15
            targets: aarch64-apple-darwin
          - name: macOS x64
            runs_on: macos-15
            targets: x86_64-apple-darwin
          - name: iOS device
            runs_on: macos-15
            targets: aarch64-apple-ios
          - name: iOS simulator arm64
            runs_on: macos-15
            targets: aarch64-apple-ios-sim
          - name: iOS simulator x64
            runs_on: macos-15
            targets: x86_64-apple-ios
          - name: Android arm64
            runs_on: ubuntu-24.04
            targets: aarch64-linux-android
          - name: Android arm
            runs_on: ubuntu-24.04
            targets: armv7-linux-androideabi
          - name: Android x64
            runs_on: ubuntu-24.04
            targets: x86_64-linux-android
          # Debian bookworm, so the library runs on its glibc and newer.
          - name: Linux x64
            runs_on: ubuntu-24.04
            container: debian:bookworm
            targets: x86_64-unknown-linux-gnu
          - name: Linux arm64
            runs_on: ubuntu-24.04-arm
            container: debian:bookworm
            targets: aarch64-unknown-linux-gnu
          - name: Windows x64
            runs_on: windows-2022
            targets: x86_64-pc-windows-msvc
          - name: Windows arm64
            runs_on: windows-11-arm
            targets: aarch64-pc-windows-msvc
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      TAG: ${{ needs.prepare-release.outputs.tag }}
    steps:
      - name: Install container build dependencies
        if: matrix.container
        working-directory: /
        run: |
          set -euo pipefail
          apt-get update
          apt-get install -y --no-install-recommends \
            binutils build-essential ca-certificates curl git pkg-config unzip             xz-utils gh
          git config --global --add safe.directory '*'

      - uses: actions/checkout@v5

      - uses: dart-lang/setup-dart@v1

      - uses: dtolnay/rust-toolchain@stable

      - name: Configure clang-cl for Windows ARM
        if: matrix.name == 'Windows arm64'
        run: echo "CC=clang-cl" >> "$GITHUB_ENV"

      - run: dart pub get

      - name: Build and sign
        env:
          PRIVATE_KEY: ${{ secrets.PRIVATE_KEY }}
          TARGETS: ${{ matrix.targets }}
        run: |
          set -euo pipefail
          if [ -n "${ANDROID_NDK_LATEST_HOME:-}" ]; then
            export ANDROID_NDK_HOME="$ANDROID_NDK_LATEST_HOME"
          fi
          args=()
          for target in $TARGETS; do args+=(--target "$target"); done
          dart run bin/precompiled_binaries.dart build --out out "${args[@]}"

      # --clobber: a rerun replaces what an interrupted run left behind.
      - name: Upload
        run: gh release upload "$TAG" out/* --clobber --repo "$GITHUB_REPOSITORY"

  verify:
    name: Verify published binaries
    needs: [prepare-release, publish]
    if: always() && needs.prepare-release.result == 'success'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - uses: dart-lang/setup-dart@v1

      - run: dart pub get

      - run: dart run bin/precompiled_binaries.dart verify
